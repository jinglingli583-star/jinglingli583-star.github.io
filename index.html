<script>
const btns = document.querySelectorAll('.play-btn');
let currentAudio = null;

btns.forEach(btn=>{
    btn.onclick = function(){
        const idx = this.getAttribute('data-idx');
        const aud = document.getElementById('aud'+idx);
        if(currentAudio){
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        aud.currentTime = 0;
        aud.play();
        currentAudio = aud;
    }
})
</script>
